<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade LATAM | Panel de Skins</title>
    
    <meta name="description" content="Calculadora exacta de cashout y comisiones para traders de CS2 en LATAM. Calculá tu ganancia real retirando por e-Brou, Prex, Midinero, Belo o Pix con cotizaciones en vivo.">
    <meta name="keywords" content="CS2, skins, cashout, calculadora, Uruguay, Argentina, Brasil, CSFloat, e-Brou, Prex, Midinero, Belo, Pix, Dolar Cripto">
    <meta name="author" content="Mateo Botta">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap');

        body { font-family: 'Chakra Petch', sans-serif; background-color: #0d0d12; background-image: radial-gradient(circle at top, #1a1a24 0%, #0d0d12 80%); color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .contenedor-principal { display: flex; gap: 20px; max-width: 900px; width: 100%; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
        .panel { background-color: #141419; padding: 30px; border-radius: 8px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border-top: 4px solid #f99f1b; border-bottom: 1px solid #2a2a35; flex: 1; min-width: 320px; }
        h2 { margin-top: 0; text-align: center; font-size: 22px; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; border-bottom: 1px dashed #2a2a35; padding-bottom: 10px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #a0a0aa; font-weight: 600; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid #2a2a35; border-radius: 4px; background-color: #09090c; color: #ffffff; box-sizing: border-box; font-family: 'Chakra Petch', sans-serif; font-size: 15px; transition: border-color 0.3s ease; }
        input:focus, select:focus { outline: none; border-color: #f99f1b; }
        button { width: 100%; padding: 12px; background-color: #f99f1b; color: #000000; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 16px; text-transform: uppercase; margin-top: 15px; font-family: 'Chakra Petch', sans-serif; }
        button:hover { background-color: #ffb443; }
        .resultados { margin-top: 25px; padding-top: 20px; border-top: 1px dashed #2a2a35; }
        .resultado-texto { font-size: 22px; margin: 5px 0 15px 0; color: #f99f1b; font-weight: 700; text-shadow: 0 0 10px rgba(249, 159, 27, 0.3); }
        .visor-skin { display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090c; border: 1px solid #2a2a35; border-radius: 8px; padding: 20px; margin-top: 15px; min-height: 200px; }
        .visor-skin img { max-width: 100%; height: auto; max-height: 180px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); transition: transform 0.3s ease; }
        .visor-skin img:hover { transform: scale(1.05); }
        .skin-nombre { margin-top: 15px; font-size: 16px; font-weight: bold; color: #ffffff; text-align: center; }

        #bot-asesor { position: fixed; bottom: 30px; right: 30px; display: flex; align-items: flex-end; gap: 15px; z-index: 1000; animation: flotar 4s ease-in-out infinite; }
        @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .burbuja { background-color: #1a1a24; color: #e0e0e0; padding: 15px; border-radius: 12px 12px 0 12px; font-size: 14px; max-width: 220px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); border: 1px solid #f99f1b; font-weight: 600; line-height: 1.4; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .avatar-icono { width: 70px; height: 70px; cursor: pointer; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="12" fill="%23f99f1b" rx="1"/><rect x="2" y="7" width="3" height="4" fill="%23f99f1b" rx="0.5"/><rect x="19" y="7" width="3" height="4" fill="%23f99f1b" rx="0.5"/><rect x="1" y="11" width="4" height="3" fill="%23f99f1b" rx="0.5"/><rect x="19" y="11" width="4" height="3" fill="%23f99f1b" rx="0.5"/><rect x="7" y="16" width="3" height="5" fill="%23f99f1b" rx="0.5"/><rect x="14" y="16" width="3" height="5" fill="%23f99f1b" rx="0.5"/><rect x="8" y="7" width="2" height="2" fill="%23141419"/><rect x="14" y="7" width="2" height="2" fill="%23141419"/><rect x="9" y="11" width="6" height="1.5" fill="%23141419"/></svg>'); background-size: contain; background-position: center; background-repeat: no-repeat; transition: transform 0.2s ease; filter: drop-shadow(0 5px 15px rgba(249, 159, 27, 0.3)); }
        .avatar-icono:hover { transform: scale(1.1); }
        .texto-destacado { color: #f99f1b; font-weight: 700; }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <div class="panel">
            <h2>Mercado de Skins</h2>
            <div class="input-group">
                <label>Buscar Arma</label>
                <input list="listaSkins" id="buscadorSkins" placeholder="Ej: AWP Asiimov..." oninput="seleccionarSkin()">
                <datalist id="listaSkins">
                    <option value="AK-47 | Redline (Field-Tested)"></option>
                    <option value="AWP | Asiimov (Field-Tested)"></option>
                    <option value="M4A1-S | Printstream (Minimal Wear)"></option>
                    <option value="Karambit | Doppler (Factory New)"></option>
                </datalist>
            </div>
            <div class="visor-skin" id="visorSkin">
                <img id="imagenSkin" src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXQ9QVcJY8gulReQ0DFSua4xJ2VDxl0Kw1cve2jMlw4gaWbcT9H69m3q4qOmb3ye-uIxzIE7ZMl0u3E8YmtiQzsqRdlMjuiLY-QIAA-YlnTr1S9" alt="Logo CS2" style="max-height: 100px; opacity: 0.5;">
                <div class="skin-nombre" id="nombreSkinTexto">Seleccioná un arma para ver su valor</div>
            </div>
        </div>

        <div class="panel">
            <h2>Calculadora de Retiro</h2>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>País</label>
                    <select id="pais" onchange="actualizarPais()">
                        <option value="UY">Uruguay</option>
                        <option value="AR">Argentina</option>
                        <option value="BR">Brasil</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Precio (USD)</label>
                    <input type="number" id="precioUSD" placeholder="0.00" oninput="calcular(); pensarRecomendacion();">
                </div>
            </div>
            <div class="input-group">
                <label>Pasarela y Tarjeta</label>
                <select id="metodoCobro" onchange="calcular()"></select>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Comisión Mercado (%)</label>
                    <input type="number" id="comisionPlataforma" value="2" oninput="calcular(); pensarRecomendacion();">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label id="labelCotizacion">Cotización</label>
                    <input type="text" id="cotizacionLocal" value="Cargando...">
                </div>
            </div>
            <button onclick="calcular()">Calcular Ganancia Neta</button>
            <div class="resultados">
                <label>Recibís limpio en USD:</label>
                <p class="resultado-texto" id="resultadoUSD">USD 0.00</p>
                <label>Equivalente en cuenta:</label>
                <p class="resultado-texto" id="resultadoLocal" style="margin-bottom: 0;">$ 0.00</p>
            </div>
        </div>
    </div>

    <div id="bot-asesor">
        <div class="burbuja" id="burbujaTexto"></div>
        <div class="avatar-icono" onclick="saludarAutomatico()"></div>
    </div>

    <script>
        const baseDeSkins = {
            "AK-47 | Redline (Field-Tested)": { precio: 15.50, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV09-5lpRoqOXtPq_SmlRc68J_n-6S8I-g2VHk-kA9YGinJo2ccwA3MwyBq1W4le_mgMLt75_Jmyc3uyM8pSGKrS2L5g" },
            "AWP | Asiimov (Field-Tested)": { precio: 125.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpotLu8JAllx8zLZAJA7cW5moWfqPbhJbTQqW9e-sB_ntbX9Zj0l78-iS26eZmXcVM2YFlS85O7x-_q15--v8jIzCBm7iFxsH2JmUapwUYbRQs6yqE" },
            "M4A1-S | Printstream (Minimal Wear)": { precio: 85.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpou-6kejhjxszfjDdO09C_k4if2a_2Y-rVxG4D-8AnjO_HotTzi1DtrUU9NjzyLNSUcAI6YFCDrAO5leu70ZK-vJibzSdr-yMw53vVk0G3jB0fauM90-beHA" },
            "Karambit | Doppler (Factory New)": { precio: 1200.00, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpovbMs8AxhfwvAdwJc-sK4nIGZnvHxDK7DqWdU6sB1teXI8oThxlLmqBA9MWmnJ4eTIAY4Nw7W81W_ku2-jMC-vs6cwXVr7HQmsSzZgVXp1k8Fv0lD" }
        };

        function seleccionarSkin() {
            let seleccion = document.getElementById('buscadorSkins').value;
            if (baseDeSkins[seleccion]) {
                document.getElementById('imagenSkin').src = baseDeSkins[seleccion].img;
                document.getElementById('imagenSkin').style.opacity = "1";
                document.getElementById('imagenSkin').style.maxHeight = "180px";
                document.getElementById('nombreSkinTexto').innerText = seleccion;
                document.getElementById('precioUSD').value = baseDeSkins[seleccion].precio;
                calcular();
                pensarRecomendacion();
            }
        }

        const opcionesUY = `
            <option value="prex_payoneer">Prex (vía Payoneer) - 2%</option>
            <option value="prex_paypal">Prex (vía PayPal) - USD 8 + IVA</option>
            <option value="ebrou_banco">e-Brou (Transferencia) - USD 1.50</option>
            <option value="midinero_paypal">Midinero (vía PayPal) - 3.5%</option>
        `;
        const opcionesAR = `
            <option value="binance_p2p_ar">Binance P2P (USDT/LTC) - ~1%</option>
            <option value="fiwind_cripto">Fiwind (Cripto a ARS) - ~1%</option>
            <option value="belo_cripto">Belo (Cripto a ARS) - 1.5%</option>
            <option value="lemon_cripto">Lemon Cash (Cripto a ARS) - 2%</option>
        `;
        const opcionesBR = `
            <option value="binance_p2p_br">Binance P2P (BRL) - ~1%</option>
            <option value="pix_exchange">Pix (vía Exchange local) - 1.5%</option>
            <option value="mercadopago_cripto">Mercado Pago (Cripto a Pix) - ~2%</option>
        `;

        window.onload = function() { actualizarPais(); };

        async function actualizarPais() {
            let pais = document.getElementById('pais').value;
            let inputCotizacion = document.getElementById('cotizacionLocal');
            inputCotizacion.value = "Cargando..."; 

            try {
                if (pais === 'UY') {
                    document.getElementById('metodoCobro').innerHTML = opcionesUY;
                    document.getElementById('labelCotizacion').innerText = "Cotización (UYU)";
                    let res = await fetch('https://open.er-api.com/v6/latest/USD');
                    let data = await res.json();
                    inputCotizacion.value = data.rates.UYU.toFixed(2);
                } else if (pais === 'AR') {
                    document.getElementById('metodoCobro').innerHTML = opcionesAR;
                    document.getElementById('labelCotizacion').innerText = "Dólar Cripto (ARS)";
                    let res = await fetch('https://dolarapi.com/v1/dolares/cripto');
                    let data = await res.json();
                    inputCotizacion.value = data.compra.toFixed(2);
                } else if (pais === 'BR') {
                    document.getElementById('metodoCobro').innerHTML = opcionesBR;
                    document.getElementById('labelCotizacion').innerText = "Cotización (BRL)";
                    let res = await fetch('https://open.er-api.com/v6/latest/USD');
                    let data = await res.json();
                    inputCotizacion.value = data.rates.BRL.toFixed(2);
                }
                
                if (document.getElementById('precioUSD').value === "") {
                    saludarAutomatico();
                } else {
                    calcular();
                    pensarRecomendacion();
                }
            } catch (error) { inputCotizacion.value = "Error"; }
        }

        function calcular() {
            let pais = document.getElementById('pais').value;
            let precio = parseFloat(document.getElementById('precioUSD').value);
            let comision = parseFloat(document.getElementById('comisionPlataforma').value);
            let cotizacion = parseFloat(document.getElementById('cotizacionLocal').value);
            let metodo = document.getElementById('metodoCobro').value;

            if(isNaN(precio) || precio <= 0 || isNaN(cotizacion)) return;

            let saldoEnPlataforma = precio - (precio * (comision / 100));
            let usdLimpio = saldoEnPlataforma;
            
            // Lógica unificada de descuentos
            if (metodo === 'prex_payoneer') { usdLimpio -= saldoEnPlataforma * 0.02; } 
            else if (metodo === 'prex_paypal') { usdLimpio -= (8 * 1.22); } 
            else if (metodo === 'ebrou_banco') { usdLimpio -= 1.50; } 
            else if (metodo === 'midinero_paypal') { usdLimpio -= saldoEnPlataforma * 0.035; }
            else if (metodo === 'belo_cripto' || metodo === 'pix_exchange') { usdLimpio -= saldoEnPlataforma * 0.015; }
            else if (metodo === 'lemon_cripto' || metodo === 'mercadopago_cripto') { usdLimpio -= saldoEnPlataforma * 0.02; }
            else if (metodo === 'fiwind_cripto' || metodo === 'binance_p2p_ar' || metodo === 'binance_p2p_br') { usdLimpio -= saldoEnPlataforma * 0.01; } // Aprox 1% en P2P/Network fees

            if (usdLimpio < 0) usdLimpio = 0;
            document.getElementById('resultadoUSD').innerText = "USD " + usdLimpio.toFixed(2);
            document.getElementById('resultadoLocal').innerText = (pais === 'UY' ? '$U' : (pais === 'AR' ? 'ARS$' : 'R$')) + " " + (usdLimpio * cotizacion).toFixed(2);
        }

        function mostrarMensajeAvatar(texto) {
            let burbuja = document.getElementById('burbujaTexto');
            burbuja.style.display = "block";
            burbuja.innerHTML = texto;
            setTimeout(() => { burbuja.style.opacity = "1"; }, 50);
        }

        function saludarAutomatico() {
            let pais = document.getElementById('pais').value;
            if (document.getElementById('precioUSD').value === "") {
                if (pais === 'BR') {
                    mostrarMensajeAvatar("Olá! Escreva o preço da sua skin e eu te ajudo a escolher a opção com menos taxas.");
                } else {
                    mostrarMensajeAvatar("¡Hola! Escribí el precio de un arma y te calculo por dónde te conviene sacar la plata.");
                }
            }
        }

        function pensarRecomendacion() {
            let pais = document.getElementById('pais').value;
            let precio = parseFloat(document.getElementById('precioUSD').value);
            let comision = parseFloat(document.getElementById('comisionPlataforma').value);

            if(isNaN(precio) || precio <= 0) {
                document.getElementById('burbujaTexto').style.opacity = "0";
                setTimeout(() => { document.getElementById('burbujaTexto').style.display = "none"; }, 300);
                return;
            }

            let saldoEnPlataforma = precio - (precio * (comision / 100));
            let maxUsd = -1;
            let mejorMetodo = "";
            let opciones = [];
            let nombres = {};

            if (pais === 'UY') {
                opciones = ['prex_payoneer', 'prex_paypal', 'ebrou_banco', 'midinero_paypal'];
                nombres = { 'prex_payoneer': 'Prex (Payoneer)', 'prex_paypal': 'Prex (PayPal)', 'ebrou_banco': 'e-Brou', 'midinero_paypal': 'Midinero' };
            } else if (pais === 'AR') {
                opciones = ['binance_p2p_ar', 'fiwind_cripto', 'belo_cripto', 'lemon_cripto'];
                nombres = { 'binance_p2p_ar': 'Binance P2P', 'fiwind_cripto': 'Fiwind', 'belo_cripto': 'Belo', 'lemon_cripto': 'Lemon Cash' };
            } else if (pais === 'BR') {
                opciones = ['binance_p2p_br', 'pix_exchange', 'mercadopago_cripto'];
                nombres = { 'binance_p2p_br': 'Binance P2P', 'pix_exchange': 'Pix Exchange', 'mercadopago_cripto': 'Mercado Pago' };
            }

            for (let i = 0; i < opciones.length; i++) {
                let metodo = opciones[i];
                let usdTemp = saldoEnPlataforma;
                if (metodo === 'prex_payoneer') usdTemp -= saldoEnPlataforma * 0.02;
                else if (metodo === 'prex_paypal') usdTemp -= (8 * 1.22);
                else if (metodo === 'ebrou_banco') usdTemp -= 1.50;
                else if (metodo === 'midinero_paypal') usdTemp -= saldoEnPlataforma * 0.035;
                else if (metodo === 'belo_cripto' || metodo === 'pix_exchange') usdTemp -= saldoEnPlataforma * 0.015;
                else if (metodo === 'lemon_cripto' || metodo === 'mercadopago_cripto') usdTemp -= saldoEnPlataforma * 0.02;
                else if (metodo === 'fiwind_cripto' || metodo === 'binance_p2p_ar' || metodo === 'binance_p2p_br') usdTemp -= saldoEnPlataforma * 0.01;

                if (usdTemp > maxUsd) { maxUsd = usdTemp; mejorMetodo = nombres[metodo]; }
            }

            if (pais === 'BR') {
                mostrarMensajeAvatar(`Para sacar esses <span class="texto-destacado">USD ${saldoEnPlataforma.toFixed(2)}</span>, é melhor usar <span class="texto-destacado">${mejorMetodo}</span>. É a opção com menos taxas!`);
            } else {
                mostrarMensajeAvatar(`Para retirar esos <span class="texto-destacado">USD ${saldoEnPlataforma.toFixed(2)}</span>, te conviene usar <span class="texto-destacado">${mejorMetodo}</span>. ¡Es la opción con menos comisiones!`);
            }
        }
    </script>
</body>
</html>
